<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر المنتجات</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f2f2f7;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .card {
      background-color: #ffffff;
      width: 100%;
      max-width: 350px;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
      box-sizing: border-box;
    }

    .card h2 {
      margin-top: 0;
      color: #1c1c1e;
      font-size: 22px;
    }

    .card p {
      color: #8e8e93;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .buy-btn {
      background-color: #34c759;
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 14px 0;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.3);
      -webkit-appearance: none;
      outline: none;
    }

    .buy-btn:active {
      transform: scale(0.97);
      background-color: #2eaf4e;
    }
  </style>
</head>
<body>

  <!-- القسم الأول: سوني -->
  <div class="card">
    <h2>بلايستيشن / سوني</h2>
    <p>شراء جهاز أو بطاقات سوني</p>
    <button class="buy-btn" onclick="shareProduct('سوني (PlayStation)', 'طلب شراء جهاز / بطاقة سوني')">شراء</button>
  </div>

  <!-- القسم الثاني: مياه فجر -->
  <div class="card">
    <h2>مياه فجر</h2>
    <p>شراء كراتين مياه فجر</p>
    <button class="buy-btn" onclick="shareProduct('مياه فجر', 'طلب شراء كرتون مياه فجر 330 مل')">شراء</button>
  </div>

  <script>
    function shareProduct(productName, productDetails) {
      const shareData = {
        title: 'شراء ' + productName,
        text: productDetails,
        url: window.location.href
      };

      if (navigator.share) {
        navigator.share(shareData).catch((err) => {
          if (err.name !== 'AbortError') {
            console.error('Share Error:', err);
          }
        });
      } else {
        alert('ميزة المشاركة تتطلب فتح الرابط بـ HTTPS ومن متصفح Safari');
      }
    }
  </script>

</body>
</html>
